  // ---------- Icons (24x24 line art, drawn in SVG so they look the same everywhere) ----------

  // ---------- Minimal protobuf reader for GTFS-realtime ----------
  // Uses multiplication instead of bit shifts so 64-bit timestamps don't overflow.
  function varint(b, p) {

  // FeedMessage(2 entity) > FeedEntity(3 trip_update) > TripUpdate(1 trip > 5 route_id, 2 stop_time_update)

  function parseFeed(buf) {

        if (f2 !== 3 || w2 !== 2) return;

            if (w5 !== 2) return;

            else if (f5 === 3) dep = eventTime(b, s5, e5);

  // ---------- Trains ----------
  function setButton(state, text) {   // the Refresh buttons on Home and on the Trains screen
    var ids = ['refresh', 'refresh2'];
    for (var i = 0; i < ids.length; i++) {
      $(ids[i]).className = 'rbtn ' + state;
      $(ids[i]).innerHTML = REFRESH_ICON + text;
    }
  }

  function loadTrains(manual) {
    if (trainsBusy) return;
    trainsBusy = true;
    if (manual) setButton('busy', 'Updating');
    get(MTA_FEED + '?t=' + Date.now(), true, function (err, buf) {
      trainsBusy = false;
      if (!err) {
        try { trains = parseFeed(buf); trainsAt = now(); trainsErr = false; freshRows = true; } catch (e) { err = e; }
      }
      if (err) trainsErr = true;
      if (manual) {
        setButton(err ? 'fail' : 'done', err ? 'Try again' : 'Updated');
        setTimeout(function () { setButton('', 'Refresh'); }, err ? 5000 : 2000);
      }
      renderTrains();
      scheduleTrains();
    });
  }

  function minuteOfDay(d) { return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }

  // Seconds between auto-updates right now, or 0 when paused overnight.
  function currentInterval() {
    var m = minuteOfDay(new Date());

    if (m >= RUSH_END && m < QUIET_START) return DAY_EVERY;
    return 0;
  }

  function scheduleTrains() {
    clearTimeout(trainTimer);
    var every = currentInterval(), wait;
    if (every) {
      wait = every * 1000;
    } else {
      // Paused: sleep until 7:45am (later tonight -> tomorrow morning).
      var d = new Date(), wake = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 7, 45, 0);
      if (wake <= d) wake.setDate(wake.getDate() + 1);
      wait = wake - d;
    }
    // Re-check when the timer fires, so a 10-minute timer that runs past 10pm doesn't fetch.
    trainTimer = setTimeout(function () { currentInterval() ? loadTrains(false) : scheduleTrains(); }, wait);
  }

  function bullet(route, cls) {
    return route === '6X' ? '<div class="bullet x ' + cls + '"><span>6</span></div>' : '<div class="bullet ' + cls + '">6</div>';
  }

  function renderTrains() {
    var t = now(), up = [];
    for (var i = 0; i < trains.length && up.length < 8; i++) {
      var secs = trains[i].time - t;
      if (secs >= -20) up.push({ route: trains[i].route, time: trains[i].time, secs: Math.max(0, secs) });
    }
    var every = currentInterval(), age = t - trainsAt;
    var hero = $('hero'), first = up[0];

    if (first) {
      var mins = Math.floor(first.secs / 60);
      hero.style.display = '';
      hero.className = 'hero' + (mins <= 2 ? ' soon' : '') + (first.secs < 60 ? ' arriving' : '');
      $('hero-min').innerHTML = first.secs < 60 ? 'Now' : mins;
      $('hero-unit').innerHTML = first.secs < 60 ? '' : 'min';
      $('hero-time').innerHTML = (first.route === '6X' ? '&#9670;6 express &middot; ' : '') + fmtTime(new Date(first.time * 1000));
      $('hero-at').getElementsByTagName('b')[0].innerHTML = first.secs < 60 ? 'Arriving' : 'Next train';
      // Bar fills as the train approaches (full = arriving; empty = 15+ minutes away).
      $('bar-fill').style.width = Math.round(Math.max(0, Math.min(1, 1 - first.secs / 900)) * 100) + '%';
    } else {
      hero.style.display = 'none';
    }

    var html = '';
    for (var j = 1; j < up.length && j < 3; j++) {   // next train in the big card + 2 more = 3 trains
      var m = Math.floor(up[j].secs / 60);
      html += '<div class="train' + (freshRows ? ' fresh' : '') + '"' + (freshRows ? ' style="-webkit-animation-delay:' + (j * 70) + 'ms;animation-delay:' + (j * 70) + 'ms"' : '') + '>' +
        bullet(up[j].route, 'sm') + '<div class="m num">' + m + '<small>min</small></div>' +
        '<div class="at num">' + fmtTime(new Date(up[j].time * 1000)) + '</div></div>';
    }
    if (!first) {
      html = '<div class="empty">' + (!trainsAt ? (trainsErr ? 'Can&rsquo;t reach the MTA. Check the Wi-Fi, then tap Refresh.' : 'Loading trains&hellip;') :
        (!every && age > 300) ? 'Auto-updates are paused overnight.<br>Tap Refresh for current times.' :
        'No uptown 6 trains reported right now.') + '</div>';

    freshRows = false;

    $('live').className = stale ? 'bad' : (every ? 'on' : '');
    $('t-status').className = stale ? 'bad' : '';
    $('t-status').innerHTML = !trainsAt ? (trainsErr ? 'Offline' : 'Connecting&hellip;') :
      (stale ? 'May be out of date &middot; ' : '') + 'Updated ' + fmtTime(new Date(trainsAt * 1000)) +

  }

  // Trains screen: the next 8 uptown trains as a 2-column grid; the first one highlighted with a
  // countdown bar, the rest showing the gap after the train before.
  function renderTrainsView(up, stale) {

        '<div class="at num"><b>' + label + '</b>' + (up[i].route === '6X' ? '&#9670; express &middot; ' : '') + fmtTime(new Date(up[i].time * 1000)) + '</div>' +

  // ---------- Weather ----------
  // Open-Meteo returns local times like "2026-11-16T06:43". Parse by hand; old Safari's Date parsing is unreliable.
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hourKey(d) { return dayKey(d) + 'T' + pad(d.getHours()) + ':00'; }

    get(WEATHER_URL, false, function (err, txt) {

      if (view === 'clock') renderBigClock();

  function todayIndex() {

    var c = w.current, dly = w.daily, di = todayIndex();
    $('now-icon').innerHTML = svg(58, 58, '<g transform="scale(2.42)">' + iconInner(iconKind(c.weather_code, c.is_day)) + '</g>');
    $('now-temp').innerHTML = Math.round(c.temperature_2m) + '&deg;';
    $('now-desc').innerHTML = wxText(c.weather_code) + ' &middot; feels like ' + Math.round(c.apparent_temperature) + '&deg;';
    $('w-label').innerHTML = 'Today &middot; ' + wxText(dly.weather_code[di]);
    $('s-hi').innerHTML = Math.round(dly.temperature_2m_max[di]) + '&deg;';
    $('s-lo').innerHTML = Math.round(dly.temperature_2m_min[di]) + '&deg;';
    $('s-rain').innerHTML = dly.precipitation_probability_max[di] + '<small>%</small>';
    $('s-wind').innerHTML = Math.round(dly.wind_speed_10m_max[di]) + '<small>mph</small>';

    renderHourly();
    updateSky();
  }

  // Sunrise / sunset in the stats row: "6:47" with a small "am".
  function renderSun() {
    var dly = weather.daily, di = todayIndex();
    function short(s) { var p = fmtHM(s).split(' '); return p[0] + '<small>' + p[1] + '</small>'; }
    $('sunrise').innerHTML = short(dly.sunrise[di]);
    $('sunset').innerHTML = short(dly.sunset[di]);

  // ---------- Hourly chart: Temp / Rain / Feels (chosen with the buttons beside it) ----------
  var MODES = {

    feels: { field: 'apparent_temperature', color: '#c3b2ff', dot: '#e0d6ff' },
    rain:  { field: 'precipitation_probability', color: '#7fbcff' }

  }

  // Next 8 hours: icon on top, then a temperature curve or rain-chance bars, then the hour.
  function renderHourly() {
    var hr = weather.hourly, start = hr.time.indexOf(hourKey(new Date()));

    var mode = MODES[chartMode], vals = hr[mode.field] || hr.temperature_2m;
    var N = 8, pts = [], lo = 999, hi = -999, i;
    for (i = 0; i < N && start + 1 + i < hr.time.length; i++) {
      var k = start + 1 + i, tmp = vals[k];

      if (tmp < lo) lo = tmp;

    var col = W / pts.length, top = 52, bot = H - 42;
    if (chartMode === 'rain') { renderRain(el, hr, pts, W, H, col, top, H - 24); return; }
    for (i = 0; i < pts.length; i++) {
      pts[i].x = col * i + col / 2;

    var g = '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + mode.color + '" stop-opacity="0.32"/><stop offset="1" stop-color="' + mode.color + '" stop-opacity="0"/></linearGradient></defs>';
    g += '<path d="' + d + ' L' + last.x.toFixed(1) + ',' + bot + ' L' + pts[0].x.toFixed(1) + ',' + bot + ' Z" fill="url(#tg)"/>';
    g += '<path d="' + d + '" fill="none" stroke="' + mode.color + '" stroke-width="2.2" stroke-linecap="round"/>';
    for (i = 0; i < pts.length; i++) {
      var q = pts[i], k2 = q.k, h = parseInt(hr.time[k2].substr(11, 2), 10), pr = hr.precipitation_probability[k2];
      g += '<g transform="translate(' + (q.x - 11).toFixed(1) + ',0) scale(0.92)">' + iconInner(iconKind(hr.weather_code[k2], hr.is_day[k2])) + '</g>';
      g += '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="3.5" fill="' + mode.dot + '"/>';
      g += '<text x="' + q.x.toFixed(1) + '" y="' + (q.y - 10).toFixed(1) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#f2f4f7" font-family="Manrope">' + Math.round(q.t) + '&#176;</text>';
      if (pr >= 20) g += '<text x="' + q.x.toFixed(1) + '" y="' + (H - 22) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#7fbcff" font-family="Manrope">' + pr + '%</text>';
      g += '<text x="' + q.x.toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="13" font-weight="500" fill="rgba(235,240,247,0.55)" font-family="Manrope">' +
        (h % 12 || 12) + (h < 12 ? 'am' : 'pm') + '</text>';
    }
    el.innerHTML = svg(W, H, g);
  }

  // Rain chance: bars on a fixed 0-100% scale (so a 10% hour never looks like a downpour).
  function renderRain(el, hr, pts, W, H, col, top, bot) {
    var g = '<defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fbcff"/><stop offset="1" stop-color="#3d7fd6" stop-opacity="0.55"/></linearGradient></defs>';
    var bw = Math.min(26, col * 0.46), full = bot - top - 14;

    for (var i = 0; i < pts.length; i++) {
      var k = pts[i].k, x = col * i + col / 2, p = pts[i].t || 0, h = parseInt(hr.time[k].substr(11, 2), 10);
      var bh = Math.max(2, p / 100 * full), y = bot - bh;
      g += '<g transform="translate(' + (x - 11).toFixed(1) + ',0) scale(0.92)">' + iconInner(iconKind(hr.weather_code[k], hr.is_day[k])) + '</g>';
      g += '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + (bot - full).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + full.toFixed(1) + '" rx="' + (bw / 2).toFixed(1) + '" fill="rgba(255,255,255,0.05)"/>';
      g += '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="' + Math.min(bw / 2, bh / 2).toFixed(1) + '" fill="url(#rg)"/>';
      g += '<text x="' + x.toFixed(1) + '" y="' + (bot - full - 6).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="700" fill="' + (p >= 30 ? '#cfe6ff' : 'rgba(235,240,247,0.6)') + '" font-family="Manrope">' + p + '%</text>';
      g += '<text x="' + x.toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="13" font-weight="500" fill="rgba(235,240,247,0.55)" font-family="Manrope">' +
        (h % 12 || 12) + (h < 12 ? 'am' : 'pm') + '</text>';
    }
    el.innerHTML = svg(W, H, g);
  }

  // ---------- Sky color follows the sun (and goes grey on overcast/rainy days) ----------
  var SKIES = {
    night: 'radial-gradient(ellipse at 15% 0%, rgba(70,90,170,0.20), rgba(0,0,0,0) 55%), linear-gradient(180deg, #05070d 0%, #0a1020 100%)',
    dawn:  'radial-gradient(ellipse at 50% 115%, rgba(255,150,120,0.32), rgba(0,0,0,0) 60%), linear-gradient(180deg, #141428 0%, #2c1c34 100%)',
    day:   'radial-gradient(ellipse at 85% -10%, rgba(120,180,255,0.24), rgba(0,0,0,0) 55%), linear-gradient(180deg, #0b1726 0%, #14304a 100%)',
    grey:  'radial-gradient(ellipse at 50% -10%, rgba(200,210,225,0.12), rgba(0,0,0,0) 60%), linear-gradient(180deg, #11161d 0%, #1d2630 100%)',

  };
  var skyNow = '', skyLayer = 0;
  function skyPhase() {
    var m = minuteOfDay(new Date()), rise = 6.5 * 60, set = 17 * 60, code = 0;
    if (weather) { var di = todayIndex(); rise = mins(weather.daily.sunrise[di]); set = mins(weather.daily.sunset[di]); code = weather.current.weather_code; }
    if (m < rise - 40 || m > set + 50) return 'night';

  }

  // ---------- Clock, dimming, vocab, burn-in ----------
  var lastDay = '', wakeUntil = 0;
  function renderClock() {
    var d = new Date(), h = d.getHours();
    $('clock').innerHTML = fmtTime(d) + '<span id="ampm">' + (h < 12 ? 'AM' : 'PM') + '</span>';
    $('date').innerHTML = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
    var night = h >= DIM_START || h < DIM_END;
    document.body.className = (night ? 'night' : '') + (night && now() < wakeUntil ? ' wake' : '');
    if (dayKey(d) !== lastDay) { lastDay = dayKey(d); renderVocab(d); }
  }

  function renderVocab(d) {
    if (typeof WORDS === 'undefined' || !WORDS.length) return;
    var dayNum = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
    var v = WORDS[dayNum % WORDS.length];
    $('v-word').innerHTML = esc(v[0]);
    $('v-pos').innerHTML = esc(v[1]);
    $('v-def').innerHTML = esc(v[2]);

  }

  function shift() {
    var h = new Date().getHours();
    var t = 'translate(' + ((h % 3) * 4 - 4) + 'px,' + ((Math.floor(h / 3) % 3) * 4 - 4) + 'px)';
    $('wrap').style.webkitTransform = t; $('wrap').style.transform = t;
  }

  // ---------- Views: Home / Forecast / Clock / Music ----------
  var VIEWS = ['home', 'trains', 'calendar', 'forecast', 'clock', 'music'];
  var view = 'home', lastTouch = now();
  var IDLE_HOME_SECONDS = 180;   // Forecast goes back to Home after 3 min untouched (Clock and Music stay)

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function showView(v) {
    view = v;
    for (var i = 0; i < VIEWS.length; i++) {
      $('view-' + VIEWS[i]).className = 'view' + (VIEWS[i] === v ? '' : ' off');
      $('nav-' + VIEWS[i]).className = VIEWS[i] === v ? 'on' : '';
    }
    // Charts measure their box, so redraw once the view is visible.
    if (v === 'home' && weather) renderWeather();
    if (v === 'forecast') renderForecast();
    if (v === 'clock') renderBigClock();

  // ---------- Forecast ----------

  }
  function dateOf(s) { return new Date(+s.substr(0, 4), +s.substr(5, 2) - 1, +s.substr(8, 2)); }
  function dayName(offset, s) { return offset === 0 ? 'Today' : offset === 1 ? 'Tomorrow' : DAYS[dateOf(s).getDay()]; }
  function uvText(u) { return u < 3 ? 'Low' : u < 6 ? 'Moderate' : u < 8 ? 'High' : u < 11 ? 'Very high' : 'Extreme'; }

  function renderForecast() {
    $('f-day').style.display = fMode === 'day' ? '' : 'none';
    $('f-week').style.display = fMode === 'week' ? '' : 'none';

  }

  function smoothPath(pts) {
    var d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ' C' + (p1.x + (p2.x - p0.x) / 6).toFixed(1) + ',' + (p1.y + (p2.y - p0.y) / 6).toFixed(1) + ' ' +
        (p2.x - (p3.x - p1.x) / 6).toFixed(1) + ',' + (p2.y - (p3.y - p1.y) / 6).toFixed(1) + ' ' +
        p2.x.toFixed(1) + ',' + p2.y.toFixed(1);
    }

  }
  function txt(x, y, s, size, weight, fill, anchor) {
    return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + (anchor || 'middle') + '" font-size="' + size +
      '" font-weight="' + weight + '" fill="' + fill + '" font-family="Manrope">' + s + '</text>';
  }

  // Day: the next 24 hours. Temperature curve on top, rain-chance bars below, night hours shaded,
  // sunrise/sunset marked.
  function renderDay() {
    var hr = weather.hourly, d = weather.daily, di = todayIndex(), c = weather.current;
    var start = hr.time.indexOf(hourKey(new Date()));
    if (start < 0) return;
    var N = Math.min(25, hr.time.length - start), pts = [], lo = 999, hi = -999, i, k;
    for (i = 0; i < N; i++) {
      k = start + i;
      pts.push({ k: k, t: hr.temperature_2m[k], p: hr.precipitation_probability[k] || 0 });
      if (hr.temperature_2m[k] < lo) lo = hr.temperature_2m[k];
      if (hr.temperature_2m[k] > hi) hi = hr.temperature_2m[k];
    }
    var el = $('daychart'), W = el.clientWidth || 600, H = el.clientHeight || 360;

    for (i = 0; i < N; i++) {
      pts[i].x = padX + i * step;
      pts[i].y = hi === lo ? (tTop + tBot) / 2 : tBot - (pts[i].t - lo) / (hi - lo) * (tBot - tTop);
    }
    var g = '<defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb46e" stop-opacity="0.3"/><stop offset="1" stop-color="#ffb46e" stop-opacity="0"/></linearGradient></defs>';
    for (i = 0; i < N; i++) {
      if (hr.is_day[pts[i].k] === 0) {
        g += '<rect x="' + Math.max(0, pts[i].x - step / 2).toFixed(1) + '" y="0" width="' + (step + 0.6).toFixed(1) +
          '" height="' + rBot.toFixed(1) + '" fill="rgba(130,150,230,0.07)"/>';
      }
    }
    var path = smoothPath(pts);
    g += '<path d="' + path + ' L' + pts[N - 1].x.toFixed(1) + ',' + tBot.toFixed(1) + ' L' + pts[0].x.toFixed(1) + ',' + tBot.toFixed(1) + ' Z" fill="url(#dg)"/>';
    g += '<path d="' + path + '" fill="none" stroke="#ffb46e" stroke-width="2.5" stroke-linecap="round"/>';

    g += txt(0, rTop - 10, 'CHANCE OF RAIN', 11, 700, 'rgba(235,240,247,0.42)', 'start');
    g += '<line x1="0" y1="' + rBot + '" x2="' + W + '" y2="' + rBot + '" stroke="rgba(255,255,255,0.1)"/>';
    var bw = Math.max(3, step * 0.55);
    for (i = 0; i < N; i++) {
      var bh = Math.max(1.5, pts[i].p / 100 * (rBot - rTop));
      g += '<rect x="' + (pts[i].x - bw / 2).toFixed(1) + '" y="' + (rBot - bh).toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + bh.toFixed(1) + '" rx="2" fill="rgba(127,188,255,' + (0.3 + 0.6 * pts[i].p / 100).toFixed(2) + ')"/>';
      if (pts[i].p >= 30 && (i % 3 === 0 || pts[i].p >= 60 && i % 2 === 0)) g += txt(pts[i].x, rBot - bh - 5, pts[i].p + '%', 11, 700, '#9fcbff');
    }
    for (i = 0; i < N; i += 3) {
      var q = pts[i], h = parseInt(hr.time[q.k].substr(11, 2), 10);

      g += '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="4" fill="#ffd3a6"/>';
      g += txt(q.x, q.y - 12, Math.round(q.t) + '&#176;', 16, 700, '#f2f4f7');
      g += txt(q.x, H - 6, i === 0 ? 'Now' : (h % 12 || 12) + (h < 12 ? 'am' : 'pm'), 13, i === 0 ? 700 : 500, i === 0 ? '#f2f4f7' : 'rgba(235,240,247,0.55)');

      for (var m = 0; m < marks.length; m++) {
        var iso = marks[m][0];
        if (!iso) continue;
        var hi2 = hr.time.indexOf(iso.substr(0, 13) + ':00');
        if (hi2 < 0) continue;
        var off = hi2 - start + (mins(iso) % 60) / 60;

        var x = padX + off * step;
        g += '<line x1="' + x.toFixed(1) + '" y1="' + (tTop - 6) + '" x2="' + x.toFixed(1) + '" y2="' + rBot + '" stroke="' + marks[m][1] + '" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.8"/>';
        g += txt(x, tBot + 18, marks[m][2] + fmtHM(iso), 12, 700, marks[m][1]);
      }
    }
    el.innerHTML = svg(W, H, g);

    function tile(label, value, note) {
      return '<div class="card tile"><span class="label">' + label + '</span><b class="num">' + value + '</b><small>' + (note || '&nbsp;') + '</small></div>';
    }
    var rise = d.sunrise[di], set = d.sunset[di];

      '<div class="trow">' + tile('Feels like', Math.round(c.apparent_temperature) + '&deg;', 'Actual ' + Math.round(c.temperature_2m) + '&deg;') +
        tile('Humidity', (hr.relative_humidity_2m ? hr.relative_humidity_2m[start] : '--') + '%', 'Right now') + '</div>' +
      '<div class="trow">' + tile('UV index', Math.round(d.uv_index_max[di]), uvText(d.uv_index_max[di]) + ' at peak') +
        tile('Wind', Math.round(d.wind_speed_10m_max[di]) + '<small style="display:inline;font-size:15px"> mph</small>', 'Max today') + '</div>' +
      '<div class="trow">' + tile('Rain today', (d.precipitation_sum[di] || 0).toFixed(2) + '&Prime;', d.precipitation_probability_max[di] + '% chance') +
        tile('Daylight', fmtDur(mins(set) - mins(rise)), fmtHM(rise) + ' &ndash; ' + fmtHM(set)) + '</div>';

      Math.round(d.temperature_2m_max[di]) + '&deg; &middot; Low ' + Math.round(d.temperature_2m_min[di]) + '&deg;';
  }

  // Week: one row per day, with a high/low bar on a shared scale (like the iOS Weather app).
  function renderWeek() {
    var d = weather.daily, di = todayIndex(), n = Math.min(7, d.time.length - di), lo = 999, hi = -999, i;
    for (i = di; i < di + n; i++) {
      if (d.temperature_2m_min[i] < lo) lo = d.temperature_2m_min[i];
      if (d.temperature_2m_max[i] > hi) hi = d.temperature_2m_max[i];
    }
    var span = Math.max(1, hi - lo), html = '', wet = -1, warm = di;
    for (i = di; i < di + n; i++) {
      var tl = d.temperature_2m_min[i], th = d.temperature_2m_max[i], pr = d.precipitation_probability_max[i];
      if (pr >= 50 && (wet < 0 || pr > d.precipitation_probability_max[wet])) wet = i;
      if (th > d.temperature_2m_max[warm]) warm = i;
      var dot = '';
      if (i === di) {
        var ct = weather.current.temperature_2m;
        dot = '<i class="wdot" style="left:' + Math.max(0, Math.min(100, (ct - lo) / span * 100)).toFixed(1) + '%"></i>';
      }
      // Colour the bar from one gradient spanning the whole week, so cold days read blue and warm days orange.
      var left = (tl - lo) / span * 100, width = Math.max(4, (th - tl) / span * 100);
      var gradPos = width >= 100 ? 0 : left / (100 - width) * 100;
      var fillStyle = 'left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%;background-size:' + (10000 / width).toFixed(1) +
        '% 100%;background-position:' + gradPos.toFixed(1) + '% 0';
      html += '<div class="wrow' + (i === di ? ' today' : '') + '">' +
        '<div class="wday">' + dayName(i - di, d.time[i]) + '</div>' +
        '<div class="wicon">' + svg(36, 36, '<g transform="scale(1.5)">' + iconInner(iconKind(d.weather_code[i], 1)) + '</g>') + '</div>' +
        '<div class="wdesc">' + wxText(d.weather_code[i]) + '</div>' +
        '<div class="wrain num">' + (pr >= 20 ? pr + '%' : '') + '</div>' +
        '<div class="wlo num">' + Math.round(tl) + '&deg;</div>' +
        '<div class="wbar"><div class="wfill" style="' + fillStyle + '"></div>' + dot + '</div>' +
        '<div class="whi num">' + Math.round(th) + '&deg;</div></div>';

    $('week-rows').innerHTML = html;
    function when(j) { return j === di ? 'today' : j === di + 1 ? 'tomorrow' : DAYS[dateOf(d.time[j]).getDay()]; }
    $('f-sub').innerHTML = (wet >= 0 ? 'Rain likely ' + when(wet) + ' (' + d.precipitation_probability_max[wet] + '%)' : 'No rain expected this week') +
      ' &middot; Warmest ' + when(warm) + ', ' + Math.round(d.temperature_2m_max[warm]) + '&deg;';
  }

  // ---------- Clock ----------
  function nextTrainSecs() {
    var t = now();
    for (var i = 0; i < trains.length; i++) if (trains[i].time - t >= -20) return Math.max(0, trains[i].time - t);
    return null;
  }
  function renderBigClock() {
    if (view !== 'clock') return;
    var d = new Date(), h = d.getHours();
    $('c-time').innerHTML = fmtTime(d) + '<span class="side"><span class="sec">' + pad(d.getSeconds()) + '</span><span class="ap">' + (h < 12 ? 'AM' : 'PM') + '</span></span>';
    $('c-date').innerHTML = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
    if (weather) {
      var c = weather.current;
      $('c-wx').innerHTML = svg(30, 30, '<g transform="scale(1.25)">' + iconInner(iconKind(c.weather_code, c.is_day)) + '</g>') +
        '<span>' + Math.round(c.temperature_2m) + '&deg; &middot; ' + wxText(c.weather_code) + '</span>';

    var st = SP.state;

        '<span>' + esc(st.item.name) + ' &middot; ' + esc(artists(st.item)) + '</span>';

  // ---------- Music (Spotify now playing + controls) ----------
  // Uses Spotify's Web API with the PKCE sign-in flow, so no server or secret is needed. You create a
  // free Spotify developer app once and paste its Client ID on the Music screen. Needs an https://
  // address (or localhost) because sign-in relies on the browser's crypto API. Controls need Premium.
  var SP_SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
  var SP_REDIRECT = location.origin + location.pathname;
  var SP = { id: lsGet('spClientId') || '', state: null, at: 0, busy: false, mode: '', msg: '' };
  var spTimer = null;
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>';
  var ICON_PREV = '<svg viewBox="0 0 24 24"><path d="M5.5 5h2.5v14H5.5zM20 5v14L9 12z" fill="currentColor"/></svg>';
  var ICON_NEXT = '<svg viewBox="0 0 24 24"><path d="M16 5h2.5v14H16zM4 5v14l11-7z" fill="currentColor"/></svg>';

  function spSupported() { return !!(window.isSecureContext && window.crypto && crypto.subtle && window.Promise && window.TextEncoder); }
  function spConnected() { return !!(SP.id && lsGet('spRefresh')); }
  function qs(o) { var a = []; for (var k in o) a.push(encodeURIComponent(k) + '=' + encodeURIComponent(o[k])); return a.join('&'); }
  function b64url(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function artists(it) {
    if (it.artists) { var a = []; for (var i = 0; i < it.artists.length; i++) a.push(it.artists[i].name); return a.join(', '); }
    return it.show ? it.show.publisher || it.show.name : '';
  }

  function spConnect() {
    var r = new Uint8Array(48);
    crypto.getRandomValues(r);
    var verifier = b64url(r.buffer);
    lsSet('spVerifier', verifier);
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(function (hash) {
      location.href = 'https://accounts.spotify.com/authorize?' + qs({ client_id: SP.id, response_type: 'code',
        redirect_uri: SP_REDIRECT, code_challenge_method: 'S256', code_challenge: b64url(hash), scope: SP_SCOPES });
    });
  }

  function spToken(params, cb) {
    var x = new XMLHttpRequest();
    x.open('POST', 'https://accounts.spotify.com/api/token', true);
    x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    x.onload = function () {
      var r = null;
      try { r = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 200 && r && r.access_token) {
        lsSet('spAccess', r.access_token);
        lsSet('spExp', String(now() + r.expires_in));
        if (r.refresh_token) lsSet('spRefresh', r.refresh_token);
        cb(null);
      } else {
        if (r && r.error === 'invalid_grant') { lsDel('spRefresh'); lsDel('spAccess'); }   // revoked or expired sign-in
        cb(new Error((r && (r.error_description || r.error)) || 'HTTP ' + x.status));
      }
    };
    x.onerror = function () { cb(new Error('network')); };
    x.timeout = 10000;   // the hourly sign-in refresh shouldn't be able to stall updates either
    x.ontimeout = function () { cb(new Error('timeout')); };
    x.send(qs(params));
  }

  function spEnsure(cb) {
    if (lsGet('spAccess') && +(lsGet('spExp') || 0) - 60 > now()) return cb(null);
    if (!spConnected()) return cb(new Error('not connected'));
    spToken({ grant_type: 'refresh_token', refresh_token: lsGet('spRefresh'), client_id: SP.id }, cb);
  }

  function spApi(method, path, cb, retried) {
    spEnsure(function (err) {
      if (err) return cb(err);
      var x = new XMLHttpRequest(), done = false;
      // A unique value on every read so Safari never answers from a saved copy of an older reply.
      var url = 'https://api.spotify.com/v1' + path + (method === 'GET' ? (path.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now() : '');
      x.open(method, url, true);
      x.setRequestHeader('Authorization', 'Bearer ' + lsGet('spAccess'));
      // Give up on a stuck request after 8 s. Otherwise one hung request on flaky Wi-Fi blocks every
      // update after it until Safari times out on its own, which can take minutes.
      x.timeout = 8000;

        var body = null;
        try { body = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) {}
        cb(x.status >= 200 && x.status < 300 ? null : new Error(x.status === 403 ? 'premium' : 'HTTP ' + x.status), body, x.status);
      };
      x.onerror = function () { if (!done) { done = true; cb(new Error('network')); } };
      x.send();
    });

  // Coming back from Spotify's sign-in page with ?code=... in the address.
  function spHandleRedirect() {

    for (var ev in acEvents) {
      (function (name, text) {
        applicationCache.addEventListener(name, function () { diag(text); }, false);
      })(ev, acEvents[ev]);
    }
    applicationCache.addEventListener('updateready', function () {
      try { applicationCache.swapCache(); } catch (e) {}
      location.reload();
    }, false);
  } else {
    diag('NOT supported by this browser');
  }

  // Any tap brightens the screen while dimmed; the Refresh button also fetches trains.
  document.addEventListener('touchstart', function () { wakeUntil = now() + WAKE_SECONDS; renderClock(); }, false);
  document.addEventListener('mousedown', function () { wakeUntil = now() + WAKE_SECONDS; renderClock(); }, false);
  $('refresh').addEventListener('click', function () { loadTrains(true); }, false);
  $('refresh2').addEventListener('click', function () { loadTrains(true); }, false);

  // Tap a Home card to open its screen, zooming out from the card. Buttons inside cards
  // (Refresh, Temp/Rain/Feels, play/pause) keep doing their own job.
  function expandTo(v, fromEl) {
    if (v === view) return;
    var r = fromEl.getBoundingClientRect();
    showView(v);
    var target = $('view-' + v), t = target.getBoundingClientRect();
    var origin = (r.left + r.width / 2 - t.left).toFixed(0) + 'px ' + (r.top + r.height / 2 - t.top).toFixed(0) + 'px';
    target.style.webkitTransformOrigin = origin;
    target.style.transformOrigin = origin;
    target.className = 'view expand';
    setTimeout(function () { if (target.className === 'view expand') target.className = 'view'; }, 500);
  }
  $('view-home').addEventListener('click', function (e) {
    for (var n = e.target; n && n !== this; n = n.parentNode) {
      if (n.tagName === 'BUTTON') return;
      var go = n.getAttribute && n.getAttribute('data-go');
      if (go) { expandTo(go, n); return; }
    }
  }, false);

  var modeBtns = $('modes').getElementsByTagName('button');
  for (var mb = 0; mb < modeBtns.length; mb++) {
    modeBtns[mb].addEventListener('click', function () { setMode(this.getAttribute('data-mode')); }, false);
  }
  setMode(chartMode);
  setButton('', 'Refresh');

  // Navigation: tap the menu at the bottom, or swipe left/right anywhere.
  var navBtns = $('nav').getElementsByTagName('button');
  for (var nb = 0; nb < navBtns.length; nb++) {
    navBtns[nb].addEventListener('click', function () { showView(this.getAttribute('data-view')); }, false);
  }
  on('f-day-btn', function () { setForecastMode('day'); });
  on('f-week-btn', function () { setForecastMode('week'); });
  var swipeX = null, swipeY = 0;
  document.addEventListener('touchstart', function (e) {
    lastTouch = now();
    var t = e.touches[0];
    swipeX = e.target.tagName === 'INPUT' ? null : t.clientX;
    swipeY = t.clientY;
  }, false);
  document.addEventListener('mousedown', function () { lastTouch = now(); }, false);
  document.addEventListener('touchend', function (e) {
    if (swipeX === null) return;
    var t = e.changedTouches[0], dx = t.clientX - swipeX, dy = t.clientY - swipeY;
    swipeX = null;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      var i = VIEWS.indexOf(view) + (dx < 0 ? 1 : -1);
      if (i >= 0 && i < VIEWS.length) showView(VIEWS[i]);
    }
  }, false);

  setForecastMode(fMode);
  showView(spHandleRedirect() ? 'music' : 'home');

  renderClock(); shift(); updateSky();
  loadTrains(false);
  loadWeather();
  setInterval(function () {
    renderClock(); renderTrains();
    if ((view === 'forecast' || view === 'trains' || view === 'calendar') && now() - lastTouch > IDLE_HOME_SECONDS) showView('home');
  }, 5000);
  setInterval(function () { renderBigClock(); tickMusic(); tickMini(); }, 1000);
  setInterval(function () { if (weather) { renderSun(); } updateSky(); }, 60000);
  setInterval(loadWeather, 15 * 60 * 1000);
  loadCalendar();
  setInterval(loadCalendar, 10 * 60 * 1000);
  setInterval(function () { renderAgenda(); renderCalendar(); }, 60000);   // keeps "Now" and past events current
  setInterval(shift, 10 * 60 * 1000);
  // Reload once a day at 7:44am (just before the morning window) to clear slow memory leaks in
  // old Safari. It loads from the offline cache. Reloading at that time keeps it from adding
  // overnight train fetches, since every page load fetches once.
  (function () {
    var d = new Date(), at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 7, 44, 0);
    if (at <= d) at.setDate(at.getDate() + 1);
    setTimeout(function () { location.reload(); }, at - d);
  })();
})();
</script>
</body>
</html>
